<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バッテリーセル記録</title>
  <!-- Excelファイル（.xlsx）生成・画像埋め込み対応ライブラリ (ExcelJS) -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
  <!-- ファイルダウンロード用ライブラリ (FileSaver.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; max-width: 600px; margin: 0 auto; background-color: #f8f9fa; }
    h1 { text-align: center; font-size: 1.4rem; margin-bottom: 15px; }
    
    .company-info-container {
      background: #fff;
      padding: 12px 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .info-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    .info-header h2 {
      font-size: 1.05rem;
      margin: 0;
      color: #333;
    }
    .info-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .info-group label {
      font-weight: bold;
      width: 120px;
      color: #333;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .info-group input, .info-group select {
      flex: 1;
      padding: 6px 10px;
      font-size: 0.95rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #fff;
    }

    /* 写真添付用スタイル */
    .photo-upload-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #f0f7ff;
      padding: 10px;
      border-radius: 6px;
      border: 1px dashed #007bff;
    }
    .photo-preview-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #photo-preview {
      max-width: 120px;
      max-height: 120px;
      border-radius: 4px;
      border: 1px solid #ccc;
      display: none;
      object-fit: contain;
      background: #eee;
    }

    .controls { 
      margin-bottom: 15px; 
      position: sticky; 
      top: 0; 
      background: #fff; 
      padding: 12px; 
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      z-index: 10;
    }
    button { font-size: 0.95rem; padding: 8px 14px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; }
    #info-mic-btn { background-color: #673AB7; color: white; border: none; }
    #info-mic-btn.listening { background-color: #f44336; }
    #start-btn { background-color: #4CAF50; color: white; border: none; }
    #start-btn.listening { background-color: #f44336; }
    #guide-btn { background-color: #0288d1; color: white; border: none; }
    #undo-btn { background-color: #ff9800; color: white; border: none; }
    #export-btn { background-color: #1D6F42; color: white; border: none; }
    #email-btn { background-color: #0078D4; color: white; border: none; }
    
    .total-v-container {
      width: 100%;
      background: #fff3cd;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #ffeeba;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      color: #856404;
    }
    .total-v-container input {
      width: 100px;
      padding: 4px;
      font-size: 1rem;
      text-align: right;
      font-weight: bold;
    }

    .mode-selector {
      width: 100%;
      background: #eef6ff;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #b6d4fe;
      display: flex;
      gap: 15px;
      align-items: center;
      font-weight: bold;
    }
    .mode-selector label { cursor: pointer; }

    #status { font-weight: bold; color: #555; }
    .recognized-text { width: 100%; font-size: 0.9rem; background: #fff; padding: 6px 10px; border: 1px solid #ddd; border-radius: 4px; color: #333; }
    .pending-status { color: #d9534f; font-weight: bold; margin-left: 10px; }

    /* 縦表示テーブル用スタイル */
    .table-container {
      background: #fff;
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 15px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; text-align: center; padding: 8px 4px; font-size: 0.95rem; }
    th { background: #f0f0f0; }
    
    input.cell-input {
      width: 90%;
      padding: 6px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      text-align: right;
    }

    .badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: bold;
      color: white;
      margin-left: 5px;
      white-space: nowrap;
    }
    .badge-max { background-color: #e53935; }
    .badge-min { background-color: #1e88e5; }

    .active-row { background-color: #e6f7ff !important; }
    .pending-row { background-color: #fffbe6 !important; }
  </style>
</head>
<body>

  <h1>バッテリーセル記録</h1>

  <!-- 基本情報エリア -->
  <div class="company-info-container">
    <div class="info-header">
      <h2>📋 基本情報</h2>
      <button id="info-mic-btn">🎤 基本情報入力</button>
    </div>
    <div class="info-group">
      <label for="company-name">会社名:</label>
      <input type="text" id="company-name" placeholder="例: 〇〇産業株式会社">
    </div>
    <div class="info-group">
      <label for="model-type">型式:</label>
      <input type="text" id="model-type" placeholder="例: EB100">
    </div>
    <div class="info-group">
      <label for="battery-type">バッテリー型式:</label>
      <input type="text" id="battery-type" placeholder="例: VFX-24V">
    </div>
    <div class="info-group">
      <label for="battery-capacity">バッテリー容量:</label>
      <input type="text" id="battery-capacity" placeholder="例: 400Ah / 5H" onchange="formatCapacityInput(this)">
    </div>
    <div class="info-group">
      <label for="mfg-number">MFG No.:</label>
      <input type="text" id="mfg-number" placeholder="例: MFG-2026-001">
    </div>
    <div class="info-group">
      <label for="measurement-timing">測定区分:</label>
      <select id="measurement-timing">
        <option value="充電前">充電前</option>
        <option value="充電後">充電後</option>
        <option value="現地年次">現地年次</option>
      </select>
    </div>

    <!-- 📸 銘板写真添付 -->
    <div class="photo-upload-group">
      <label for="plate-photo-input" style="font-weight: bold; color: #0056b3;">📸 バッテリー銘板写真:</label>
      <div class="photo-preview-container">
        <input type="file" id="plate-photo-input" accept="image/*" capture="environment" onchange="handlePhotoSelect(event)">
        <img id="photo-preview" alt="銘板写真プレビュー">
        <button type="button" id="remove-photo-btn" onclick="removePhoto()" style="display:none; padding:4px 8px; font-size:0.8rem; background:#dc3545; color:white; border:none;">削除</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="start-btn">🎤 数値入力 開始</button>
    <button id="guide-btn">❓ 音声ガイド</button>
    <button id="undo-btn">↩️ 1つ戻す</button>
    <button id="export-btn">📊 Excelファイル（.xlsx）出力</button>
    <button id="email-btn">📧 メールで送信</button>
    <span id="status">停止中</span>

    <div class="total-v-container">
      <label for="total-voltage">⚡ 全体電圧 (V):</label>
      <input type="number" step="0.01" id="total-voltage" placeholder="48.50" onchange="formatVoltageInput(this)">
      <span>V</span>
      <span style="font-size:0.8rem; font-weight:normal; color:#666;">（音声例：「トータル 48.5」）</span>
    </div>

    <div class="mode-selector">
      <span>入力対象:</span>
      <label><input type="radio" name="input-target" id="radio-sg" value="sg" checked> 🧪 比重</label>
      <label><input type="radio" name="input-target" id="radio-v" value="v"> ⚡ 電圧</label>
    </div>
    
    <div class="recognized-text">
      認識テキスト: <span id="last-speech" style="font-weight:bold; color:#1a0dab;">-</span>
      <span id="pending-info" class="pending-status"></span>
    </div>
  </div>

  <!-- 縦並びテーブル -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 20%;">セル No.</th>
          <th style="width: 40%;">比重 (S.G.)</th>
          <th style="width: 40%;">電圧 (V)</th>
        </tr>
      </thead>
      <tbody>
        <script>
          for (let i = 1; i <= 24; i++) {
            document.write(`
              <tr id="tr-${i}">
                <td style="font-weight:bold; background:#f9f9f9;">${i}</td>
                <td>
                  <div style="display:flex; align-items:center; justify-content:center;">
                    <input type="text" class="cell-input" id="sg-${i}" onchange="formatSgInput(this)" oninput="updateMinMaxHighlights()">
                    <span id="badge-sg-${i}"></span>
                  </div>
                </td>
                <td>
                  <div style="display:flex; align-items:center; justify-content:center;">
                    <input type="number" step="0.01" class="cell-input" id="v-${i}" onchange="formatVoltageInput(this)" oninput="updateMinMaxHighlights()">
                    <span id="badge-v-${i}"></span>
                  </div>
                </td>
              </tr>
            `);
          }
        </script>
      </tbody>
    </table>
  </div>

  <script>
    const historyStack = [];
    let pendingCellNum = null;
    let pendingTimer = null;
    let currentAutoCellNum = 1;
    let isSpeaking = false;

    // 写真保持用データ
    let uploadedImageBase64 = null;
    let uploadedImageType = "jpeg";
    let originalImageWidth = 400;
    let originalImageHeight = 300;

    function handlePhotoSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');

          let width = img.width;
          let height = img.height;

          const maxDim = 1200;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          uploadedImageBase64 = canvas.toDataURL('image/jpeg', 0.85);
          uploadedImageType = 'jpeg';
          originalImageWidth = width;
          originalImageHeight = height;

          const imgElem = document.getElementById('photo-preview');
          imgElem.src = uploadedImageBase64;
          imgElem.style.display = 'block';
          document.getElementById('remove-photo-btn').style.display = 'inline-block';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function removePhoto() {
      uploadedImageBase64 = null;
      document.getElementById('plate-photo-input').value = "";
      document.getElementById('photo-preview').style.display = 'none';
      document.getElementById('remove-photo-btn').style.display = 'none';
    }

    let activeListenMode = null; 
    let recognition = null;

    function formatCapacityValue(val) {
      if (!val) return "";
      const match = val.match(/\d+/);
      if (match) {
        return `${match[0]}Ah / 5H`;
      }
      return val;
    }

    function formatCapacityInput(inputElem) {
      inputElem.value = formatCapacityValue(inputElem.value);
    }

    function formatSgValue(val) {
      if (val === "測定不能" || val === "" || val === null || val === undefined) return val;
      const num = parseFloat(val);
      return isNaN(num) ? val : num.toFixed(3);
    }

    function formatVoltageValue(val) {
      if (val === "" || val === null || val === undefined) return val;
      const num = parseFloat(val);
      return isNaN(num) ? val : num.toFixed(2);
    }

    function formatSgInput(inputElem) {
      if (inputElem.value !== "測定不能") {
        inputElem.value = formatSgValue(inputElem.value);
      }
      updateMinMaxHighlights();
    }

    function formatVoltageInput(inputElem) {
      inputElem.value = formatVoltageValue(inputElem.value);
      updateMinMaxHighlights();
    }

    function speak(text, onEndCallback = null) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        isSpeaking = true;

        if (activeListenMode && recognition) {
          try { recognition.stop(); } catch(e) {}
        }

        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        uttr.rate = 1.1;

        const handleEnd = () => {
          setTimeout(() => { 
            isSpeaking = false; 
            if (activeListenMode && recognition) {
              try { recognition.start(); } catch(e) {}
            }
            if (onEndCallback) onEndCallback();
          }, 400);
        };

        uttr.onend = handleEnd;
        uttr.onerror = handleEnd;

        window.speechSynthesis.speak(uttr);
      } else {
        if (onEndCallback) onEndCallback();
      }
    }

    function updateMinMaxHighlights() {
      const stats = calculateMinMax();

      for (let i = 1; i <= 24; i++) {
        const badgeSg = document.getElementById(`badge-sg-${i}`);
        const badgeV = document.getElementById(`badge-v-${i}`);
        badgeSg.innerHTML = '';
        badgeV.innerHTML = '';

        const sgRaw = document.getElementById(`sg-${i}`).value;
        const sgVal = parseFloat(sgRaw);
        const vVal = parseFloat(document.getElementById(`v-${i}`).value);

        if (!isNaN(sgVal) && sgRaw !== "測定不能") {
          if (stats.sg.max !== null && sgVal === stats.sg.max) {
            badgeSg.innerHTML = '<span class="badge badge-max">最高</span>';
          } else if (stats.sg.min !== null && sgVal === stats.sg.min) {
            badgeSg.innerHTML = '<span class="badge badge-min">最低</span>';
          }
        }

        if (!isNaN(vVal)) {
          if (stats.v.max !== null && vVal === stats.v.max) {
            badgeV.innerHTML = '<span class="badge badge-max">最高</span>';
          } else if (stats.v.min !== null && vVal === stats.v.min) {
            badgeV.innerHTML = '<span class="badge badge-min">最低</span>';
          }
        }
      }
    }

    function calculateMinMax() {
      let sgList = [];
      let vList = [];

      for (let i = 1; i <= 24; i++) {
        const sgRaw = document.getElementById(`sg-${i}`).value;
        const sgVal = parseFloat(sgRaw);
        const vVal = parseFloat(document.getElementById(`v-${i}`).value);

        if (!isNaN(sgVal) && sgRaw !== "測定不能") sgList.push({ cell: i, val: sgVal });
        if (!isNaN(vVal)) vList.push({ cell: i, val: vVal });
      }

      const getStats = (list) => {
        if (list.length === 0) return { min: null, max: null, minCells: [], maxCells: [] };
        const vals = list.map(item => item.val);
        const min = Math.min(...vals);
        const max = Math.max(...vals);

        const minCells = list.filter(item => item.val === min).map(item => item.cell);
        const maxCells = list.filter(item => item.val === max).map(item => item.cell);

        return { min, max, minCells, maxCells };
      };

      return {
        sg: getStats(sgList),
        v: getStats(vList)
      };
    }

    function setPendingCell(cellNum) {
      clearPendingCellUI();
      pendingCellNum = cellNum;
      currentAutoCellNum = cellNum;
      const pendingInfo = document.getElementById('pending-info');
      
      if (cellNum) {
        pendingInfo.textContent = `⏳ ${cellNum}番 の数値入力待ち...`;
        const targetTr = document.getElementById(`tr-${cellNum}`);
        if (targetTr) targetTr.classList.add('pending-row');

        clearTimeout(pendingTimer);
        pendingTimer = setTimeout(() => {
          clearPendingCell();
        }, 8000);
      }
    }

    function clearPendingCellUI() {
      document.querySelectorAll('tr').forEach(tr => {
        tr.classList.remove('pending-row');
      });
      document.getElementById('pending-info').textContent = '';
    }

    function clearPendingCell() {
      pendingCellNum = null;
      clearPendingCellUI();
      clearTimeout(pendingTimer);
    }

    function setMode(modeValue, shouldSpeak = true) {
      const targetRadio = document.querySelector(`input[name="input-target"][value="${modeValue}"]`);
      if (targetRadio) {
        targetRadio.checked = true;
        if (shouldSpeak) {
          const modeName = modeValue === 'sg' ? '比重' : '電圧';
          speak(`${modeName}に変更しました`);
        }
      }
    }

    function undoLastAction() {
      if (historyStack.length === 0) {
        speak("戻せる操作がありません");
        return;
      }
      const lastState = historyStack.pop();

      if (lastState.type === 'input-field') {
        document.getElementById(lastState.id).value = lastState.value;
      } else if (lastState.type === 'total-voltage') {
        document.getElementById('total-voltage').value = lastState.value;
      } else {
        for (const inputId in lastState.values) {
          document.getElementById(inputId).value = lastState.values[inputId];
        }
        document.querySelectorAll('tr').forEach(tr => tr.classList.remove('active-row'));
        if (lastState.activeCellNum) {
          currentAutoCellNum = lastState.activeCellNum;
          const targetTr = document.getElementById(`tr-${lastState.activeCellNum}`);
          if (targetTr) targetTr.classList.add('active-row');
        }
      }
      clearPendingCell();
      updateMinMaxHighlights();
      speak("1つ戻しました");
    }

    document.getElementById('undo-btn').addEventListener('click', undoLastAction);

    document.getElementById('guide-btn').addEventListener('click', () => {
      const guideText = 
        "音声入力の使い方を説明します。" +
        "基本情報は右上『基本情報入力』ボタンを押し『会社名 トヨタ』『型式 EB100』『容量 400』『充電前』のようにお話しください。" +
        "セル数値の入力は『数値入力 開始』ボタンを押します。" +
        "数値のみを『1.250』や『2.15』とおっしゃると、1番セルから順に自動入力されます。" +
        "特定セルを指定する場合は『5番 1.250』や『12番 測定不能』とお話しください。" +
        "全体電圧は『トータル 48.5』で入力できます。";
      speak(guideText);
    });

    function normalizeSpeechText(text) {
      let t = text;
      t = t.replace(/(?:あー|あ〜|えー|え〜|うー|う〜|んー|ん〜|えっと|あのー|あの〜)/g, '');
      t = t.replace(/点|てん|テン|一転|回転/g, '.');
      t = t.replace(/ロック|録|六|ログ/g, '6');
      t = t.replace(/(?:ろく|ロク)\s*(?:番|セル)?/g, '6番');
      t = t.replace(/イチ/g, '1').replace(/ニ/g, '2').replace(/サン/g, '3')
           .replace(/ヨン/g, '4').replace(/ゴ/g, '5').replace(/ロク/g, '6')
           .replace(/ナナ/g, '7').replace(/ハチ/g, '8').replace(/キュウ/g, '9');

      const kanjiMap = {
        'ゼロ':0, 'レイ':0, 'れい':0, '〇':0,
        'いち':1, '一':1, 'に':2, '二':2, 'さん':3, '三':3,
        'よん':4, 'し':4, '四':4, 'ご':5, '五':5, 'ろく':6, '六':6,
        'なな':7, 'しち':7, '七':7, 'はち':8, '八':8, 'きゅう':9, 'く':9, '九':9
      };

      t = t.replace(/二十([一二三四1234])/g, (_, p1) => 20 + (kanjiMap[p1] || parseInt(p1)));
      t = t.replace(/二十/g, '20');
      t = t.replace(/十([一二三四五六七八九123456789])/g, (_, p1) => 10 + (kanjiMap[p1] || parseInt(p1)));
      t = t.replace(/十/g, '10');
      t = t.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xfee0));

      for (let k in kanjiMap) {
        t = t.split(k).join(kanjiMap[k]);
      }
      
      t = t.replace(/(\d+)\s*\.\s*(\d+)/g, '$1.$2');
      return t.trim();
    }

    function extractExplicitCellNumber(text) {
      const match = text.match(/(?:セル|セルナンバー|ナンバー|No|no)?\s*(\d{1,2})\s*(?:番|セル)/);
      if (match) {
        const num = parseInt(match[1], 10);
        if (num >= 1 && num <= 24) return num;
      }
      return null;
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = false;

      const startBtn = document.getElementById('start-btn');
      const infoMicBtn = document.getElementById('info-mic-btn');
      const status = document.getElementById('status');
      const lastSpeech = document.getElementById('last-speech');

      function stopListening() {
        activeListenMode = null;
        try { recognition.stop(); } catch(e) {}
        
        status.textContent = "停止中";
        status.style.color = "#555";
        
        startBtn.textContent = "🎤 数値入力 開始";
        startBtn.classList.remove('listening');
        
        infoMicBtn.textContent = "🎤 基本情報入力";
        infoMicBtn.classList.remove('listening');

        clearPendingCell();
      }

      function startListeningMode(mode) {
        if (activeListenMode === mode) {
          stopListening();
          speak("音声入力を終了します");
          return;
        }

        stopListening();
        activeListenMode = mode;

        if (mode === 'info') {
          infoMicBtn.textContent = "⌛ 起動中...";
          speak("基本情報の音声入力を開始します", () => {
            try {
              recognition.start();
              status.textContent = "基本情報 認識中...";
              status.style.color = "#673AB7";
              infoMicBtn.textContent = "⏹️ 登録終了";
              infoMicBtn.classList.add('listening');
            } catch (e) { console.error(e); }
          });
        } else if (mode === 'cell') {
          startBtn.textContent = "⌛ 起動中...";
          speak("セル数値の音声入力を開始します", () => {
            try {
              recognition.start();
              status.textContent = "セル数値 認識中...";
              status.style.color = "green";
              startBtn.textContent = "⏹️ 数値入力 停止";
              startBtn.classList.add('listening');
            } catch (e) { console.error(e); }
          });
        }
      }

      startBtn.addEventListener('click', () => startListeningMode('cell'));
      infoMicBtn.addEventListener('click', () => startListeningMode('info'));

      recognition.onresult = (event) => {
        if (isSpeaking) return;

        const lastIndex = event.results.length - 1;
        const rawText = event.results[lastIndex][0].transcript;
        
        lastSpeech.textContent = rawText;

        if (rawText.match(/終了|しゅうりょう|停止|ていし|おわり|終わり/)) {
          stopListening();
          speak("音声入力を終了します");
          return;
        }

        const normalized = normalizeSpeechText(rawText);
        if (!normalized) return;

        if (activeListenMode === 'info') {
          let registeredCount = 0;

          if (rawText.match(/会社名|会社|かいしゃめい|かいしゃ/)) {
            const val = rawText.replace(/^.*?(?:会社名|会社|かいしゃめい|かいしゃ)\s*/, '').replace(/(?:型式|モデル|バッテリー|容量|MFG|製造|測定|区分|充電).*$/, '').trim();
            if (val) {
              document.getElementById('company-name').value = val;
              registeredCount++;
            }
          }

          if (rawText.match(/バッテリー型式|バッテリーのかたしき|バッテリータイプ/)) {
            const val = normalized.replace(/^.*?(?:バッテリー型式|バッテリーのかたしき|バッテリータイプ)\s*/, '').replace(/(?:型式|モデル|容量|MFG|製造|測定|区分|充電).*$/, '').trim();
            if (val) {
              document.getElementById('battery-type').value = val;
              registeredCount++;
            }
          }

          if (rawText.match(/(?:^|[^バッテリー])(?:型式|かたしき|モデル)/)) {
            const val = normalized.replace(/^.*?(?:型式|かたしき|モデル)\s*/, '').replace(/(?:バッテリー|容量|MFG|製造|測定|区分|充電).*$/, '').trim();
            if (val) {
              document.getElementById('model-type').value = val;
              registeredCount++;
            }
          }

          if (rawText.match(/バッテリー容量|容量|ようりょう/)) {
            const val = normalized.replace(/^.*?(?:バッテリー容量|容量|ようりょう)\s*/, '').replace(/(?:MFG|製造|測定|区分|充電).*$/, '').trim();
            if (val) {
              const formattedCapacity = formatCapacityValue(val);
              document.getElementById('battery-capacity').value = formattedCapacity;
              registeredCount++;
            }
          }

          if (rawText.match(/MFG|エムエフジー|製造番号|シリアル/i)) {
            const val = normalized.replace(/^.*?(?:MFG|エムエフジー|製造番号|シリアル)\s*(?:ナンバー|No|no)?\s*/i, '').replace(/(?:測定|区分|充電).*$/, '').trim();
            if (val) {
              document.getElementById('mfg-number').value = val;
              registeredCount++;
            }
          }

          if (rawText.match(/充電前|充電後|現地年次|年次/)) {
            let selectedTiming = "";
            if (rawText.match(/充電前/)) selectedTiming = "充電前";
            else if (rawText.match(/充電後/)) selectedTiming = "充電後";
            else if (rawText.match(/現地年次|年次/)) selectedTiming = "現地年次";

            if (selectedTiming) {
              document.getElementById('measurement-timing').value = selectedTiming;
              registeredCount++;
            }
          }

          if (registeredCount > 0) {
            speak("基本情報を登録しました");
            stopListening();
          } else {
            speak("基本情報を認識できませんでした。もう一度お試しください");
          }
          return;
        }

        if (activeListenMode === 'cell') {
          if (rawText.match(/トータル|全体|ぜんたい|合計|ごうけい|総電圧|全電圧/)) {
            const numMatch = normalized.match(/\d+\.\d+|\d+/);
            if (numMatch) {
              const formattedVal = formatVoltageValue(numMatch[0]);
              const prevVal = document.getElementById('total-voltage').value;
              historyStack.push({ type: 'total-voltage', value: prevVal });
              document.getElementById('total-voltage').value = formattedVal;
              speak(`全体電圧、${formattedVal}ボルト`);
              clearPendingCell();
              return;
            }
          }

          if (rawText.match(/比重|ひじゅう/)) {
            if (!rawText.match(/\d+/) || rawText.match(/モード|測り/)) {
              setMode('sg');
              clearPendingCell();
              return;
            }
          }
          if (rawText.match(/電圧|でんあつ/)) {
            if (!rawText.match(/\d+/) || rawText.match(/モード|測り/)) {
              setMode('v');
              clearPendingCell();
              return;
            }
          }

          if (rawText.match(/戻す|もどす|やり直し|キャンセル|違う|ちがう/)) {
            undoLastAction();
            return;
          }
          if (rawText.match(/クリア|消す|消去/)) {
            clearPendingCell();
            speak("選択を解除しました");
            return;
          }

          const isImpossible = rawText.match(/測定不能|そくていふのう|不能|ふのう|測れない|hかれない/);

          const explicitCellNum = extractExplicitCellNumber(normalized);
          const floatMatches = normalized.match(/\d+\.\d+|\d+/g) || [];

          if (explicitCellNum !== null) {
            if (isImpossible) {
              applyValueToCell(explicitCellNum, "測定不能");
              return;
            }

            let valueStr = null;
            for (let n of floatMatches) {
              if (n !== String(explicitCellNum)) {
                valueStr = n;
                break;
              }
            }

            if (valueStr !== null) {
              applyValueToCell(explicitCellNum, valueStr);
            } else {
              setPendingCell(explicitCellNum);
              speak(`${explicitCellNum}番`);
            }
            return;
          }

          if (pendingCellNum) {
            if (isImpossible) {
              applyValueToCell(pendingCellNum, "測定不能");
              return;
            }
            if (floatMatches.length > 0) {
              applyValueToCell(pendingCellNum, floatMatches[0]);
              return;
            }
          }

          if (isImpossible) {
            applyValueToCell(currentAutoCellNum, "測定不能");
            return;
          }

          if (floatMatches.length > 0) {
            applyValueToCell(currentAutoCellNum, floatMatches[0]);
          }
        }
      };

      function applyValueToCell(cellNum, val) {
        if (cellNum < 1 || cellNum > 24) return;

        const currentMode = document.querySelector('input[name="input-target"]:checked').value;

        if (currentMode === 'sg' && val !== "測定不能") {
          const numVal = parseFloat(val);
          if (isNaN(numVal) || numVal < 1.100 || numVal > 1.400) {
            speak("比重の範囲外です");
            return;
          }
        }

        if (currentMode === 'v') {
          const numVal = parseFloat(val);
          if (isNaN(numVal) || numVal < 0.50 || numVal > 2.50) {
            speak("電圧の範囲外です");
            return;
          }
        }

        const previousState = {
          type: 'cell',
          activeCellNum: currentAutoCellNum,
          values: {
            [`sg-${cellNum}`]: document.getElementById(`sg-${cellNum}`).value,
            [`v-${cellNum}`]: document.getElementById(`v-${cellNum}`).value
          }
        };

        let updated = false;
        let formattedVal = val;

        if (currentMode === 'sg') {
          formattedVal = formatSgValue(val);
          document.getElementById(`sg-${cellNum}`).value = formattedVal;
          updated = true;
        } else if (currentMode === 'v') {
          formattedVal = formatVoltageValue(val);
          document.getElementById(`v-${cellNum}`).value = formattedVal;
          updated = true;
        }

        if (updated) {
          historyStack.push(previousState);
          clearPendingCell();

          document.querySelectorAll('tr').forEach(tr => {
            tr.classList.remove('active-row');
            tr.classList.remove('pending-row');
          });

          const targetTr = document.getElementById(`tr-${cellNum}`);
          if (targetTr) targetTr.classList.add('active-row');

          updateMinMaxHighlights();
          speak(`${cellNum}番、${formattedVal}`);

          if (cellNum < 24) {
            currentAutoCellNum = cellNum + 1;
          }
        }
      }

      recognition.onerror = (event) => {
        if (event.error === 'no-speech' || event.error === 'aborted') return;
        console.error("音声認識エラー:", event.error);
        status.textContent = "エラー: " + event.error;
        status.style.color = "red";
      };

      recognition.onend = () => {
        if (activeListenMode && !isSpeaking) {
          try { recognition.start(); } catch(e) {}
        }
      };
    } else {
      alert("お使いのブラウザは音声認識機能に対応していません。Google Chromeをお試しください。");
    }

    // 共通のExcel生成ロジック
    async function generateExcelWorkbook() {
      const stats = calculateMinMax();
      const companyNameRaw = document.getElementById('company-name').value.trim();
      const modelTypeRaw = document.getElementById('model-type').value.trim();
      const measurementTiming = document.getElementById('measurement-timing').value;

      const companyName = companyNameRaw || "-";
      const modelType = modelTypeRaw || "-";
      const batteryType = document.getElementById('battery-type').value || "-";
      const batteryCapacity = document.getElementById('battery-capacity').value || "-";
      const mfgNumber = document.getElementById('mfg-number').value || "-";
      const totalV = formatVoltageValue(document.getElementById('total-voltage').value) || "-";

      const sgMinStr = stats.sg.min !== null ? `${formatSgValue(stats.sg.min)} (${stats.sg.minCells.map(c=>c+'番').join('&')})` : "-";
      const sgMaxStr = stats.sg.max !== null ? `${formatSgValue(stats.sg.max)} (${stats.sg.maxCells.map(c=>c+'番').join('&')})` : "-";
      const vMinStr  = stats.v.min  !== null ? `${formatVoltageValue(stats.v.min)} (${stats.v.minCells.map(c=>c+'番').join('&')})`  : "-";
      const vMaxStr  = stats.v.max  !== null ? `${formatVoltageValue(stats.v.max)} (${stats.v.maxCells.map(c=>c+'番').join('&')})`  : "-";

      const workbook = new ExcelJS.Workbook();
      const worksheet = workbook.addWorksheet('バッテリー測定結果');

      worksheet.pageSetup = {
        paperSize: 9,
        orientation: 'portrait',
        fitToPage: true,
        fitToWidth: 1,
        fitToHeight: 0
      };

      const fontDefault = { name: 'メイリオ', size: 9 };
      const borderThin = {
        top: { style: 'thin', color: { argb: 'FFCCCCCC' } },
        left: { style: 'thin', color: { argb: 'FFCCCCCC' } },
        bottom: { style: 'thin', color: { argb: 'FFCCCCCC' } },
        right: { style: 'thin', color: { argb: 'FFCCCCCC' } }
      };

      const applyRowStyles = (rowNumber, values, styleOptions) => {
        const row = worksheet.getRow(rowNumber);
        values.forEach((val, idx) => {
          const cell = row.getCell(idx + 1);
          cell.value = val;
          cell.font = styleOptions.font || fontDefault;
          cell.alignment = styleOptions.alignment || { vertical: 'middle', horizontal: 'center' };
          cell.border = borderThin;
          if (styleOptions.fill) cell.fill = styleOptions.fill;
          if (styleOptions.numFmt) cell.numFmt = styleOptions.numFmt;
        });
      };

      worksheet.mergeCells('A1:M1');
      const titleCell = worksheet.getCell('A1');
      titleCell.value = 'バッテリー測定結果';
      titleCell.font = { name: 'メイリオ', size: 16, bold: true, color: { argb: 'FFFFFFFF' } };
      titleCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1F4E79' } };
      titleCell.alignment = { vertical: 'middle', horizontal: 'center' };

      const createSectionHeader = (rowNum, title) => {
        worksheet.mergeCells(`A${rowNum}:B${rowNum}`);
        const cell = worksheet.getCell(`A${rowNum}`);
        cell.value = title;
        cell.font = { name: 'メイリオ', size: 10, bold: true };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE9ECEF' } };
        cell.alignment = { vertical: 'middle', horizontal: 'left' };
        worksheet.getCell(`B${rowNum}`).border = borderThin;
      };

      const createMergedInfoRow = (rowNum, label, valStr, fillObj = null, fontColor = null) => {
        worksheet.getCell(`A${rowNum}`).value = label;
        worksheet.getCell(`A${rowNum}`).font = { name: 'メイリオ', size: 9, bold: true };
        worksheet.getCell(`A${rowNum}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF0F0F0' } };
        worksheet.getCell(`A${rowNum}`).alignment = { vertical: 'middle', horizontal: 'center' };
        worksheet.getCell(`A${rowNum}`).border = borderThin;

        worksheet.mergeCells(`B${rowNum}:M${rowNum}`);
        const valCell = worksheet.getCell(`B${rowNum}`);
        valCell.value = valStr;
        valCell.font = { name: 'メイリオ', size: 9, bold: fontColor ? true : false, color: fontColor ? { argb: fontColor } : { argb: 'FF000000' } };
        valCell.alignment = { vertical: 'middle', horizontal: 'left' };
        if (fillObj) valCell.fill = fillObj;
        
        for (let col = 2; col <= 13; col++) {
          worksheet.getRow(rowNum).getCell(col).border = borderThin;
        }
      };

      createSectionHeader(2, '■ 基本情報');
      createMergedInfoRow(3, '会社名', companyName);
      createMergedInfoRow(4, '型式', modelType);
      createMergedInfoRow(5, 'バッテリー型式', batteryType);
      createMergedInfoRow(6, 'バッテリー容量', batteryCapacity);
      createMergedInfoRow(7, 'MFG No.', mfgNumber);
      createMergedInfoRow(8, '測定区分', measurementTiming);

      createSectionHeader(9, '■ 全体情報');
      createMergedInfoRow(10, '全体電圧 (V)', totalV !== "-" ? `${totalV} V` : "-");
      
      const fillRed = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFEBEE' } };
      const fillBlue = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE3F2FD' } };

      createMergedInfoRow(11, '比重 最低値', sgMinStr, fillBlue, 'FF1976D2');
      createMergedInfoRow(12, '比重 最高値', sgMaxStr, fillRed, 'FFD32F2F');
      createMergedInfoRow(13, '電圧 最低値', vMinStr, fillBlue, 'FF1976D2');
      createMergedInfoRow(14, '電圧 最高値', vMaxStr, fillRed, 'FFD32F2F');

      const appendBlockBlock = (startRow, title, startCell, endCell, headerBg) => {
        createSectionHeader(startRow, `■ ${title}`);

        const headers = ['セル No.'];
        for (let i = startCell; i <= endCell; i++) headers.push(i);
        applyRowStyles(startRow + 1, headers, {
          font: { name: 'メイリオ', size: 9, bold: true, color: { argb: 'FFFFFFFF' } },
          fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: headerBg } }
        });
        worksheet.getRow(startRow + 1).getCell(1).font = { name: 'メイリオ', size: 9, bold: true };
        worksheet.getRow(startRow + 1).getCell(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF0F0F0' } };

        const sgRow = worksheet.getRow(startRow + 2);
        sgRow.getCell(1).value = '比重 (S.G.)';
        sgRow.getCell(1).font = { name: 'メイリオ', size: 9, bold: true };
        sgRow.getCell(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF0F0F0' } };
        sgRow.getCell(1).alignment = { vertical: 'middle', horizontal: 'center' };
        sgRow.getCell(1).border = borderThin;

        for (let i = startCell; i <= endCell; i++) {
          const colIdx = i - startCell + 2;
          const cell = sgRow.getCell(colIdx);
          const rawVal = document.getElementById(`sg-${i}`).value;
          const val = parseFloat(rawVal);

          cell.border = borderThin;
          cell.alignment = { vertical: 'middle', horizontal: 'right' };

          if (rawVal === "測定不能") {
            cell.value = "測定不能";
            cell.font = fontDefault;
          } else if (!isNaN(val)) {
            cell.value = val;
            cell.numFmt = '0.000';
            if (stats.sg.max !== null && val === stats.sg.max) {
              cell.font = { name: 'メイリオ', size: 9, bold: true, color: { argb: 'FFD32F2F' } };
              cell.fill = fillRed;
            } else if (stats.sg.min !== null && val === stats.sg.min) {
              cell.font = { name: 'メイリオ', size: 9, bold: true, color: { argb: 'FF1976D2' } };
              cell.fill = fillBlue;
            } else {
              cell.font = fontDefault;
            }
          }
        }

        const vRow = worksheet.getRow(startRow + 3);
        vRow.getCell(1).value = '電圧 (V)';
        vRow.getCell(1).font = { name: 'メイリオ', size: 9, bold: true };
        vRow.getCell(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF0F0F0' } };
        vRow.getCell(1).alignment = { vertical: 'middle', horizontal: 'center' };
        vRow.getCell(1).border = borderThin;

        for (let i = startCell; i <= endCell; i++) {
          const colIdx = i - startCell + 2;
          const cell = vRow.getCell(colIdx);
          const rawVal = document.getElementById(`v-${i}`).value;
          const val = parseFloat(rawVal);

          cell.border = borderThin;
          cell.alignment = { vertical: 'middle', horizontal: 'right' };

          if (!isNaN(val)) {
            cell.value = val;
            cell.numFmt = '0.00';
            if (stats.v.max !== null && val === stats.v.max) {
              cell.font = { name: 'メイリオ', size: 9, bold: true, color: { argb: 'FFD32F2F' } };
              cell.fill = fillRed;
            } else if (stats.v.min !== null && val === stats.v.min) {
              cell.font = { name: 'メイリオ', size: 9, bold: true, color: { argb: 'FF1976D2' } };
              cell.fill = fillBlue;
            } else {
              cell.font = fontDefault;
            }
          }
        }
      };

      appendBlockBlock(15, "1〜12番", 1, 12, "FF17A2B8");
      appendBlockBlock(19, "13〜24番", 13, 24, "FF0984E3");

      let nextRow = 23;

      if (uploadedImageBase64) {
        createSectionHeader(nextRow, '■ バッテリー銘板写真');
        
        const maxDisplayWidth = 400;
        const maxDisplayHeight = 300;
        
        let displayWidth = originalImageWidth;
        let displayHeight = originalImageHeight;
        
        if (displayWidth > maxDisplayWidth || displayHeight > maxDisplayHeight) {
          const ratio = displayWidth / displayHeight;
          if (ratio > 1) {
            displayWidth = maxDisplayWidth;
            displayHeight = Math.round(maxDisplayWidth / ratio);
          } else {
            displayHeight = maxDisplayHeight;
            displayWidth = Math.round(maxDisplayHeight * ratio);
          }
        }

        const imageId = workbook.addImage({
          base64: uploadedImageBase64,
          extension: uploadedImageType,
        });

        worksheet.addImage(imageId, {
          tl: { col: 0.2, row: nextRow },
          ext: { width: displayWidth, height: displayHeight },
          editAs: 'oneCell'
        });
      }

      worksheet.getColumn(1).width = 15;
      for (let col = 2; col <= 13; col++) {
        worksheet.getColumn(col).width = 6;
      }

      const now = new Date();
      const timestamp = now.getFullYear() +
        String(now.getMonth() + 1).padStart(2, '0') +
        String(now.getDate()).padStart(2, '0') + "_" +
        String(now.getHours()).padStart(2, '0') +
        String(now.getMinutes()).padStart(2, '0');

      const sanitize = (str) => str.replace(/[\/\\?%*:|"<>]/g, '_');
      const safeCompany = companyNameRaw ? sanitize(companyNameRaw) : "未設定";
      const safeModel = modelTypeRaw ? sanitize(modelTypeRaw) : "未設定";
      const safeTiming = sanitize(measurementTiming);

      const fileName = `バッテリー測定結果_${safeCompany}_${safeTiming}_${safeModel}_${timestamp}.xlsx`;
      const buffer = await workbook.xlsx.writeBuffer();

      return { buffer, fileName };
    }

    // Excelファイル出力ボタン
    document.getElementById('export-btn').addEventListener('click', async () => {
      if (typeof ExcelJS === 'undefined') {
        alert("Excelライブラリの読み込みに失敗しました。インターネット接続を確認してください。");
        return;
      }

      speak("測定結果をExcelファイルに出力します。");
      const { buffer, fileName } = await generateExcelWorkbook();
      saveAs(new Blob([buffer]), fileName);
    });

    // メールで送信ボタン
    document.getElementById('email-btn').addEventListener('click', async () => {
      if (typeof ExcelJS === 'undefined') {
        alert("Excelライブラリの読み込みに失敗しました。インターネット接続を確認してください。");
        return;
      }

      speak("測定結果をメールで送信します。");
      const { buffer, fileName } = await generateExcelWorkbook();
      const file = new File([buffer], fileName, { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });

      const companyName = document.getElementById('company-name').value || "未設定";
      const modelType = document.getElementById('model-type').value || "未設定";
      const timing = document.getElementById('measurement-timing').value;

      const subject = `【バッテリー測定報告】${companyName} (${timing} / 型式: ${modelType})`;
      const body = 
        `関係者各位\n\n` +
        `お疲れ様です。\n` +
        `以下のバッテリー測定結果（Excelファイル）をお送りいたします。\n\n` +
        `■ 会社名: ${companyName}\n` +
        `■ 型式: ${modelType}\n` +
        `■ 測定区分: ${timing}\n\n` +
        `よろしくお願いいたします。`;

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.canShare({ files: [file] });
          await navigator.share({
            files: [file],
            title: subject,
            text: body,
          });
          return;
        } catch (err) {
          if (err.name !== 'AbortError') {
            console.error("共有エラー:", err);
          } else {
            return;
          }
        }
      }

      saveAs(file, fileName);

      const mailtoUrl = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      window.location.href = mailtoUrl;

      alert(
        `Excelファイルをダウンロードしました。\n\n` +
        `お使いのブラウザ・環境ではメーラーへの直接ファイル添付が制限されているため、\n` +
        `起動したメール画面に、ダウンロードされたファイル（${fileName}）を手動でドラッグ＆ドロップしてご添付ください。`
      );
    });
  </script>
