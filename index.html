<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バッテリーセル記録（音声入力 & Excel出力）</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    .controls { 
      margin-bottom: 20px; 
      position: sticky; 
      top: 0; 
      background: #fff; 
      padding: 15px 0; 
      border-bottom: 2px solid #ddd;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    button { font-size: 1rem; padding: 10px 18px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; }
    #start-btn { background-color: #4CAF50; color: white; border: none; }
    #start-btn.listening { background-color: #f44336; }
    #export-btn { background-color: #2196F3; color: white; border: none; }
    #status { font-weight: bold; color: #555; margin-left: 5px; }
    .hint { width: 100%; margin-top: 5px; color: #666; font-size: 0.9rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #f0f0f0; }
    input { width: 80%; padding: 6px; text-align: right; font-size: 1rem; }
    .active-row { background-color: #e6f7ff; }
  </style>
</head>
<body>

  <h1>バッテリーセル測定記録</h1>

  <div class="controls">
    <button id="start-btn">🎤 音声入力 開始</button>
    <button id="export-btn">📊 Excel用CSVダウンロード</button>
    <span id="status">停止中</span>
    <div class="hint">発声例：「セル 1 比重 1 点 28 電圧 2 点 15」</div>
  </div>

  <table>
    <thead>
      <tr>
        <th>セル No.</th>
        <th>比重 (S.G.)</th>
        <th>電圧 (V)</th>
      </tr>
    </thead>
    <tbody id="cell-table-body">
      <!-- 24セル分を自動生成 -->
    </tbody>
  </table>

  <script>
    // 1. テーブル（24セル）生成
    const tbody = document.getElementById('cell-table-body');
    for (let i = 1; i <= 24; i++) {
      const tr = document.createElement('tr');
      tr.id = `row-${i}`;
      tr.innerHTML = `
        <td>Cell ${i}</td>
        <td><input type="number" step="0.001" id="sg-${i}" placeholder="例: 1.280"></td>
        <td><input type="number" step="0.01" id="v-${i}" placeholder="例: 2.15"></td>
      `;
      tbody.appendChild(tr);
    }

    // 2. 音声認識（Web Speech API）
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
      alert("お使いのブラウザは音声認識に対応していません。Google Chromeをお試しください。");
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = false;

      const startBtn = document.getElementById('start-btn');
      const status = document.getElementById('status');
      let isListening = false;

      startBtn.addEventListener('click', () => {
        if (!isListening) {
          recognition.start();
          status.textContent = "音声認識中...";
          status.style.color = "green";
          startBtn.textContent = "⏹️ 音声入力 停止";
          startBtn.classList.add('listening');
          isListening = true;
        } else {
          recognition.stop();
          status.textContent = "停止中";
          status.style.color = "#555";
          startBtn.textContent = "🎤 音声入力 開始";
          startBtn.classList.remove('listening');
          isListening = false;
        }
      });

      recognition.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        let text = event.results[lastIndex][0].transcript;
        console.log("認識結果:", text);

        // 音声テキストの補正・正規化
        text = text.replace(/点/g, '.')
                   .replace(/いち/g, '1').replace(/に/g, '2').replace(/さん/g, '3')
                   .replace(/よん|し/g, '4').replace(/ご/g, '5').replace(/ろく/g, '6')
                   .replace(/なな|しち/g, '7').replace(/はち/g, '8').replace(/きゅう|く/g, '9')
                   .replace(/ぜろ|れい/g, '0');

        const cellMatch = text.match(/(?:セル|ばん|No|no)?\s*(\d{1,2})/);
        const sgMatch = text.match(/比重\s*(\d(?:\.\d+)?)/);
        const vMatch = text.match(/電圧\s*(\d(?:\.\d+)?)/);

        if (cellMatch) {
          const cellNum = parseInt(cellMatch[1], 10);
          
          if (cellNum >= 1 && cellNum <= 24) {
            document.querySelectorAll('tr').forEach(r => r.classList.remove('active-row'));
            const targetRow = document.getElementById(`row-${cellNum}`);
            if (targetRow) targetRow.classList.add('active-row');

            if (sgMatch) {
              document.getElementById(`sg-${cellNum}`).value = sgMatch[1];
            }
            if (vMatch) {
              document.getElementById(`v-${cellNum}`).value = vMatch[1];
            }
          }
        }
      };

      recognition.onend = () => {
        if (isListening) recognition.start();
      };
    }

    // 3. Excel用CSVのエクスポート機能（文字化け防止BOM付き）
    document.getElementById('export-btn').addEventListener('click', () => {
      let csvContent = "セル No.,比重 (S.G.),電圧 (V)\n";

      for (let i = 1; i <= 24; i++) {
        const sg = document.getElementById(`sg-${i}`).value || "";
        const v = document.getElementById(`v-${i}`).value || "";
        csvContent += `Cell ${i},${sg},${v}\n`;
      }

      // 日本語Excelでの文字化け防止（BOMヘッダー \uFEFF を付与）
      const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
      const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
      
      // ダウンロード実行
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      
      // 日時付きファイル名を作成（例: battery_data_20260927_103000.csv）
      const now = new Date();
      const timestamp = now.getFullYear() +
        String(now.getMonth() + 1).padStart(2, '0') +
        String(now.getDate()).padStart(2, '0') + "_" +
        String(now.getHours()).padStart(2, '0') +
        String(now.getMinutes()).padStart(2, '0');
      
      link.setAttribute("href", url);
      link.setAttribute("download", `battery_data_${timestamp}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  </script>
</body>
</html>
