<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バッテリーセル記録（Excel罫線・カラー装飾出力対応版）</title>
  <!-- Excelファイル（.xlsx）生成・装飾用ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; max-width: 1200px; margin: 0 auto; background-color: #f8f9fa; }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 15px; }
    
    .controls { 
      margin-bottom: 15px; 
      position: sticky; 
      top: 0; 
      background: #fff; 
      padding: 12px; 
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      z-index: 10;
    }
    button { font-size: 0.95rem; padding: 8px 14px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; }
    #start-btn { background-color: #4CAF50; color: white; border: none; }
    #start-btn.listening { background-color: #f44336; }
    #undo-btn { background-color: #ff9800; color: white; border: none; }
    #export-btn { background-color: #1D6F42; color: white; border: none; }
    
    .total-v-container {
      width: 100%;
      background: #fff3cd;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #ffeeba;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      color: #856404;
    }
    .total-v-container input {
      width: 100px;
      padding: 4px;
      font-size: 1rem;
      text-align: right;
      font-weight: bold;
    }

    .mode-selector {
      width: 100%;
      background: #eef6ff;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #b6d4fe;
      display: flex;
      gap: 15px;
      align-items: center;
      font-weight: bold;
    }
    .mode-selector label { cursor: pointer; }

    #status { font-weight: bold; color: #555; }
    .recognized-text { width: 100%; font-size: 0.9rem; background: #fff; padding: 6px 10px; border: 1px solid #ddd; border-radius: 4px; color: #333; }
    .pending-status { color: #d9534f; font-weight: bold; margin-left: 10px; }

    /* 横並びテーブル用スタイル */
    .table-container {
      overflow-x: auto;
      background: #fff;
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 15px;
    }
    .grid-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }
    .grid-table th, .grid-table td {
      border: 1px solid #ccc;
      text-align: center;
      padding: 4px;
      font-size: 0.85rem;
    }
    .grid-table th { background: #f0f0f0; }
    .row-header { background: #e9ecef; font-weight: bold; width: 80px; }
    .cell-header { background: #17a2b8; color: white; font-weight: bold; }
    
    .cell-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 2px;
    }
    .cell-box input {
      width: 90%;
      padding: 4px 2px;
      text-align: right;
      font-size: 0.9rem;
      border: 1px solid #ccc;
      border-radius: 3px;
    }

    .badge {
      font-size: 0.65rem;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: bold;
      color: white;
      white-space: nowrap;
    }
    .badge-max { background-color: #e53935; }
    .badge-min { background-color: #1e88e5; }

    .active-cell { background-color: #e6f7ff !important; border: 2px solid #1890ff !important; }
    .pending-cell { background-color: #fffbe6 !important; border: 2px dashed #ffc107 !important; }
  </style>
</head>
<body>

  <h1>バッテリーセル測定記録（Excel出力対応）</h1>

  <div class="controls">
    <button id="start-btn">🎤 音声入力 開始</button>
    <button id="undo-btn">↩️ 1つ戻す</button>
    <button id="export-btn">📊 Excelファイル（.xlsx）出力</button>
    <span id="status">停止中</span>

    <div class="total-v-container">
      <label for="total-voltage">⚡ 全体電圧 (V):</label>
      <input type="number" step="0.01" id="total-voltage" placeholder="48.50">
      <span>V</span>
      <span style="font-size:0.8rem; font-weight:normal; color:#666;">（音声例：「トータル 48.5」）</span>
    </div>

    <div class="mode-selector">
      <span>入力対象:</span>
      <label><input type="radio" name="input-target" id="radio-sg" value="sg" checked> 🧪 比重モード</label>
      <label><input type="radio" name="input-target" id="radio-v" value="v"> ⚡ 電圧モード</label>
      <label><input type="radio" name="input-target" id="radio-both" value="both"> 🔄 両方モード</label>
    </div>
    
    <div class="recognized-text">
      認識テキスト: <span id="last-speech" style="font-weight:bold; color:#1a0dab;">-</span>
      <span id="pending-info" class="pending-status"></span>
    </div>
  </div>

  <!-- 上段：セル 1～12 -->
  <div class="table-container">
    <table class="grid-table">
      <thead>
        <tr>
          <th class="row-header">セル No.</th>
          <script>
            for(let i=1; i<=12; i++) document.write(`<th class="cell-header">${i}</th>`);
          </script>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="row-header">比重 (S.G.)</td>
          <script>
            for(let i=1; i<=12; i++) {
              document.write(`
                <td id="td-sg-${i}">
                  <div class="cell-box">
                    <input type="number" step="0.001" id="sg-${i}" placeholder="1.280" oninput="updateMinMaxHighlights()">
                    <span id="badge-sg-${i}"></span>
                  </div>
                </td>
              `);
            }
          </script>
        </tr>
        <tr>
          <td class="row-header">電圧 (V)</td>
          <script>
            for(let i=1; i<=12; i++) {
              document.write(`
                <td id="td-v-${i}">
                  <div class="cell-box">
                    <input type="number" step="0.01" id="v-${i}" placeholder="2.15" oninput="updateMinMaxHighlights()">
                    <span id="badge-v-${i}"></span>
                  </div>
                </td>
              `);
            }
          </script>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 下段：セル 13～24 -->
  <div class="table-container">
    <table class="grid-table">
      <thead>
        <tr>
          <th class="row-header">セル No.</th>
          <script>
            for(let i=13; i<=24; i++) document.write(`<th class="cell-header" style="background:#0984e3;">${i}</th>`);
          </script>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="row-header">比重 (S.G.)</td>
          <script>
            for(let i=13; i<=24; i++) {
              document.write(`
                <td id="td-sg-${i}">
                  <div class="cell-box">
                    <input type="number" step="0.001" id="sg-${i}" placeholder="1.280" oninput="updateMinMaxHighlights()">
                    <span id="badge-sg-${i}"></span>
                  </div>
                </td>
              `);
            }
          </script>
        </tr>
        <tr>
          <td class="row-header">電圧 (V)</td>
          <script>
            for(let i=13; i<=24; i++) {
              document.write(`
                <td id="td-v-${i}">
                  <div class="cell-box">
                    <input type="number" step="0.01" id="v-${i}" placeholder="2.15" oninput="updateMinMaxHighlights()">
                    <span id="badge-v-${i}"></span>
                  </div>
                </td>
              `);
            }
          </script>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const historyStack = [];
    let pendingCellNum = null;
    let pendingTimer = null;
    let currentAutoCellNum = 1;
    let isSpeaking = false;

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        uttr.rate = 1.2;

        uttr.onstart = () => { isSpeaking = true; };
        uttr.onend = () => { setTimeout(() => { isSpeaking = false; }, 300); };
        uttr.onerror = () => { isSpeaking = false; };

        window.speechSynthesis.speak(uttr);
      }
    }

    function updateMinMaxHighlights() {
      const stats = calculateMinMax();

      for (let i = 1; i <= 24; i++) {
        const badgeSg = document.getElementById(`badge-sg-${i}`);
        const badgeV = document.getElementById(`badge-v-${i}`);
        badgeSg.innerHTML = '';
        badgeV.innerHTML = '';

        const sgVal = parseFloat(document.getElementById(`sg-${i}`).value);
        const vVal = parseFloat(document.getElementById(`v-${i}`).value);

        if (!isNaN(sgVal)) {
          if (stats.sg.max !== null && sgVal === stats.sg.max) {
            badgeSg.innerHTML = '<span class="badge badge-max">最高</span>';
          } else if (stats.sg.min !== null && sgVal === stats.sg.min) {
            badgeSg.innerHTML = '<span class="badge badge-min">最低</span>';
          }
        }

        if (!isNaN(vVal)) {
          if (stats.v.max !== null && vVal === stats.v.max) {
            badgeV.innerHTML = '<span class="badge badge-max">最高</span>';
          } else if (stats.v.min !== null && vVal === stats.v.min) {
            badgeV.innerHTML = '<span class="badge badge-min">最低</span>';
          }
        }
      }
    }

    function calculateMinMax() {
      let sgList = [];
      let vList = [];

      for (let i = 1; i <= 24; i++) {
        const sgVal = parseFloat(document.getElementById(`sg-${i}`).value);
        const vVal = parseFloat(document.getElementById(`v-${i}`).value);

        if (!isNaN(sgVal)) sgList.push({ cell: i, val: sgVal });
        if (!isNaN(vVal)) vList.push({ cell: i, val: vVal });
      }

      const getStats = (list) => {
        if (list.length === 0) return { min: null, max: null, minCells: [], maxCells: [] };
        const vals = list.map(item => item.val);
        const min = Math.min(...vals);
        const max = Math.max(...vals);

        const minCells = list.filter(item => item.val === min).map(item => item.cell);
        const maxCells = list.filter(item => item.val === max).map(item => item.cell);

        return { min, max, minCells, maxCells };
      };

      return {
        sg: getStats(sgList),
        v: getStats(vList)
      };
    }

    function setPendingCell(cellNum) {
      clearPendingCellUI();
      pendingCellNum = cellNum;
      currentAutoCellNum = cellNum;
      const pendingInfo = document.getElementById('pending-info');
      
      if (cellNum) {
        pendingInfo.textContent = `⏳ ${cellNum}番 の数値入力待ち...`;
        const targetTdSg = document.getElementById(`td-sg-${cellNum}`);
        const targetTdV = document.getElementById(`td-v-${cellNum}`);
        if (targetTdSg) targetTdSg.classList.add('pending-cell');
        if (targetTdV) targetTdV.classList.add('pending-cell');

        clearTimeout(pendingTimer);
        pendingTimer = setTimeout(() => {
          clearPendingCell();
        }, 7000);
      }
    }

    function clearPendingCellUI() {
      document.querySelectorAll('td').forEach(td => {
        td.classList.remove('pending-cell');
      });
      document.getElementById('pending-info').textContent = '';
    }

    function clearPendingCell() {
      pendingCellNum = null;
      clearPendingCellUI();
      clearTimeout(pendingTimer);
    }

    function setMode(modeValue, shouldSpeak = true) {
      const targetRadio = document.querySelector(`input[name="input-target"][value="${modeValue}"]`);
      if (targetRadio) {
        targetRadio.checked = true;
        if (shouldSpeak) {
          const modeName = modeValue === 'sg' ? '比重' : modeValue === 'v' ? '電圧' : '両方';
          speak(`${modeName}モードに変更しました`);
        }
      }
    }

    function undoLastAction() {
      if (historyStack.length === 0) {
        speak("戻せる操作がありません");
        return;
      }
      const lastState = historyStack.pop();

      if (lastState.type === 'total-voltage') {
        document.getElementById('total-voltage').value = lastState.value;
      } else {
        for (const inputId in lastState.values) {
          document.getElementById(inputId).value = lastState.values[inputId];
        }
        document.querySelectorAll('td').forEach(td => td.classList.remove('active-cell'));
        if (lastState.activeCellNum) {
          currentAutoCellNum = lastState.activeCellNum;
          const targetTdSg = document.getElementById(`td-sg-${lastState.activeCellNum}`);
          const targetTdV = document.getElementById(`td-v-${lastState.activeCellNum}`);
          if (targetTdSg) targetTdSg.classList.add('active-cell');
          if (targetTdV) targetTdV.classList.add('active-cell');
        }
      }
      clearPendingCell();
      updateMinMaxHighlights();
      speak("1つ戻しました");
    }

    document.getElementById('undo-btn').addEventListener('click', undoLastAction);

    function normalizeSpeechText(text) {
      let t = text;

      t = t.replace(/点|てん|テン|一転|回転/g, '.');
      t = t.replace(/ロック|録|六|ログ/g, '6');
      t = t.replace(/(?:ろく|ロク)\s*(?:番|セル)?/g, '6番');

      t = t.replace(/イチ/g, '1').replace(/ニ/g, '2').replace(/サン/g, '3')
           .replace(/ヨン/g, '4').replace(/ゴ/g, '5').replace(/ロク/g, '6')
           .replace(/ナナ/g, '7').replace(/ハチ/g, '8').replace(/キュウ/g, '9');

      const kanjiMap = {
        'ゼロ':0, 'レイ':0, 'れい':0, '〇':0,
        'いち':1, '一':1, 'に':2, '二':2, 'さん':3, '三':3,
        'よん':4, 'し':4, '四':4, 'ご':5, '五':5, 'ろく':6, '六':6,
        'なな':7, 'しち':7, '七':7, 'はち':8, '八':8, 'きゅう':9, 'く':9, '九':9
      };

      t = t.replace(/二十([一二三四1234])/g, (_, p1) => 20 + (kanjiMap[p1] || parseInt(p1)));
      t = t.replace(/二十/g, '20');
      t = t.replace(/十([一二三四五六七八九123456789])/g, (_, p1) => 10 + (kanjiMap[p1] || parseInt(p1)));
      t = t.replace(/十/g, '10');
      t = t.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xfee0));

      for (let k in kanjiMap) {
        t = t.split(k).join(kanjiMap[k]);
      }
      
      t = t.replace(/(\d+)\s*\.\s*(\d+)/g, '$1.$2');
      return t;
    }

    function extractExplicitCellNumber(text) {
      const match = text.match(/(?:セル|セルナンバー|ナンバー|No|no)?\s*(\d{1,2})\s*(?:番|セル)/);
      if (match) {
        const num = parseInt(match[1], 10);
        if (num >= 1 && num <= 24) return num;
      }
      return null;
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = false;

      const startBtn = document.getElementById('start-btn');
      const status = document.getElementById('status');
      const lastSpeech = document.getElementById('last-speech');
      let isListening = false;

      function stopListening() {
        isListening = false;
        recognition.stop();
        status.textContent = "停止中";
        status.style.color = "#555";
        startBtn.textContent = "🎤 音声入力 開始";
        startBtn.classList.remove('listening');
        clearPendingCell();
        speak("音声入力を終了します");
      }

      function startListening() {
        try {
          recognition.start();
          status.textContent = "音声認識中...";
          status.style.color = "green";
          startBtn.textContent = "⏹️ 音声入力 停止";
          startBtn.classList.add('listening');
          isListening = true;
          speak("音声入力を開始します");
        } catch (e) {
          console.error("開始エラー:", e);
        }
      }

      startBtn.addEventListener('click', () => {
        if (!isListening) startListening();
        else stopListening();
      });

      recognition.onresult = (event) => {
        if (isSpeaking) return;

        const lastIndex = event.results.length - 1;
        const rawText = event.results[lastIndex][0].transcript;
        
        lastSpeech.textContent = rawText;

        if (rawText.match(/終了|しゅうりょう|停止|ていし|おわり|終わり/)) {
          stopListening();
          return;
        }

        const normalized = normalizeSpeechText(rawText);

        if (rawText.match(/トータル|全体|ぜんたい|合計|ごうけい|総電圧|全電圧/)) {
          const numMatch = normalized.match(/\d+\.\d+|\d+/);
          if (numMatch) {
            const totalVal = numMatch[0];
            const prevVal = document.getElementById('total-voltage').value;
            historyStack.push({ type: 'total-voltage', value: prevVal });
            document.getElementById('total-voltage').value = totalVal;
            speak(`全体電圧、${totalVal}ボルト`);
            clearPendingCell();
            return;
          }
        }

        if (rawText.match(/比重|ひじゅう/)) {
          if (!rawText.match(/\d+/) || rawText.match(/モード|測り/)) {
            setMode('sg');
            clearPendingCell();
            return;
          }
        }
        if (rawText.match(/電圧|でんあつ/)) {
          if (!rawText.match(/\d+/) || rawText.match(/モード|測り/)) {
            setMode('v');
            clearPendingCell();
            return;
          }
        }

        if (rawText.match(/戻す|もどす|やり直し|キャンセル/)) {
          undoLastAction();
          return;
        }
        if (rawText.match(/クリア|消す|消去/)) {
          clearPendingCell();
          speak("選択を解除しました");
          return;
        }

        const explicitCellNum = extractExplicitCellNumber(normalized);
        const floatMatches = normalized.match(/\d+\.\d+|\d+/g) || [];

        if (explicitCellNum !== null) {
          let valueStr = null;
          for (let n of floatMatches) {
            if (n !== String(explicitCellNum)) {
              valueStr = n;
              break;
            }
          }

          if (valueStr !== null) {
            applyValueToCell(explicitCellNum, valueStr);
          } else {
            setPendingCell(explicitCellNum);
            speak(`${explicitCellNum}番`);
          }
          return;
        }

        if (pendingCellNum && floatMatches.length > 0) {
          applyValueToCell(pendingCellNum, floatMatches[0]);
          return;
        }

        if (floatMatches.length > 0) {
          applyValueToCell(currentAutoCellNum, floatMatches[0]);
        }
      };

      function applyValueToCell(cellNum, val) {
        if (cellNum < 1 || cellNum > 24) return;

        const currentMode = document.querySelector('input[name="input-target"]:checked').value;

        const previousState = {
          type: 'cell',
          activeCellNum: currentAutoCellNum,
          values: {
            [`sg-${cellNum}`]: document.getElementById(`sg-${cellNum}`).value,
            [`v-${cellNum}`]: document.getElementById(`v-${cellNum}`).value
          }
        };

        let updated = false;

        if (currentMode === 'sg') {
          document.getElementById(`sg-${cellNum}`).value = val;
          updated = true;
        } else if (currentMode === 'v') {
          document.getElementById(`v-${cellNum}`).value = val;
          updated = true;
        } else if (currentMode === 'both') {
          if (parseFloat(val) > 1.0 && parseFloat(val) < 2.0) {
            document.getElementById(`sg-${cellNum}`).value = val;
            updated = true;
          } else if (parseFloat(val) >= 2.0) {
            document.getElementById(`v-${cellNum}`).value = val;
            updated = true;
          }
        }

        if (updated) {
          historyStack.push(previousState);
          clearPendingCell();

          document.querySelectorAll('td').forEach(td => {
            td.classList.remove('active-cell');
            td.classList.remove('pending-cell');
          });

          const targetTdSg = document.getElementById(`td-sg-${cellNum}`);
          const targetTdV = document.getElementById(`td-v-${cellNum}`);
          if (targetTdSg) targetTdSg.classList.add('active-cell');
          if (targetTdV) targetTdV.classList.add('active-cell');

          updateMinMaxHighlights();
          speak(`${cellNum}番、${val}`);

          if (cellNum < 24) {
            currentAutoCellNum = cellNum + 1;
          }
        }
      }

      recognition.onerror = (event) => {
        console.error("音声認識エラー:", event.error);
        status.textContent = "エラー: " + event.error;
        status.style.color = "red";
      };

      recognition.onend = () => {
        if (isListening) {
          try { recognition.start(); } catch(e) {}
        }
      };
    } else {
      alert("お使いのブラウザは音声認識機能に対応していません。Google Chromeをお試しください。");
    }

    // ★【新機能】装飾（罫線・背景色・フォント色）付きExcelファイル（.xlsx）の出力処理
    document.getElementById('export-btn').addEventListener('click', () => {
      if (typeof XLSX === 'undefined') {
        alert("Excelライブラリの読み込みに失敗しました。インターネット接続を確認してください。");
        return;
      }

      const stats = calculateMinMax();
      const totalV = document.getElementById('total-voltage').value || "-";

      const sgMinStr = stats.sg.min !== null ? `${stats.sg.min} (${stats.sg.minCells.map(c=>c+'番').join('&')})` : "-";
      const sgMaxStr = stats.sg.max !== null ? `${stats.sg.max} (${stats.sg.maxCells.map(c=>c+'番').join('&')})` : "-";
      const vMinStr  = stats.v.min  !== null ? `${stats.v.min} (${stats.v.minCells.map(c=>c+'番').join('&')})`  : "-";
      const vMaxStr  = stats.v.max  !== null ? `${stats.v.max} (${stats.v.maxCells.map(c=>c+'番').join('&')})`  : "-";

      // スタイル定義（共通罫線・色指定）
      const thinBorder = {
        top: { style: "thin", color: { rgb: "CCCCCC" } },
        bottom: { style: "thin", color: { rgb: "CCCCCC" } },
        left: { style: "thin", color: { rgb: "CCCCCC" } },
        right: { style: "thin", color: { rgb: "CCCCCC" } }
      };

      const styleTitle = {
        font: { bold: true, size: 12, color: { rgb: "111111" } },
        fill: { fgColor: { rgb: "E9ECEF" } },
        border: thinBorder,
        alignment: { horizontal: "left", vertical: "center" }
      };

      const styleHeader = {
        font: { bold: true, color: { rgb: "FFFFFF" } },
        fill: { fgColor: { rgb: "17A2B8" } },
        border: thinBorder,
        alignment: { horizontal: "center", vertical: "center" }
      };

      const styleHeader2 = {
        font: { bold: true, color: { rgb: "FFFFFF" } },
        fill: { fgColor: { rgb: "0984E3" } },
        border: thinBorder,
        alignment: { horizontal: "center", vertical: "center" }
      };

      const styleRowLabel = {
        font: { bold: true, color: { rgb: "333333" } },
        fill: { fgColor: { rgb: "F0F0F0" } },
        border: thinBorder,
        alignment: { horizontal: "center", vertical: "center" }
      };

      const styleNormal = {
        font: { color: { rgb: "000000" } },
        border: thinBorder,
        alignment: { horizontal: "right", vertical: "center" }
      };

      const styleMax = {
        font: { bold: true, color: { rgb: "D32F2F" } }, // 赤太字
        fill: { fgColor: { rgb: "FFEBEE" } },           // 薄赤背景
        border: thinBorder,
        alignment: { horizontal: "right", vertical: "center" }
      };

      const styleMin = {
        font: { bold: true, color: { rgb: "1976D2" } }, // 青太字
        fill: { fgColor: { rgb: "E3F2FD" } },           // 薄青背景
        border: thinBorder,
        alignment: { horizontal: "right", vertical: "center" }
      };

      // ワークシートデータ構築
      const wsData = [];

      // ■ 全体情報
      wsData.push([{ v: "■ 全体情報", s: styleTitle }, { v: "", s: styleTitle }]);
      wsData.push([{ v: "全体電圧 (V)", s: styleRowLabel }, { v: totalV, s: styleNormal }]);
      wsData.push([{ v: "比重 最低値 (S.G.)", s: styleRowLabel }, { v: sgMinStr, s: styleMin }]);
      wsData.push([{ v: "比重 最高値 (S.G.)", s: styleRowLabel }, { v: sgMaxStr, s: styleMax }]);
      wsData.push([{ v: "電圧 最低値 (V)", s: styleRowLabel }, { v: vMinStr, s: styleMin }]);
      wsData.push([{ v: "電圧 最高値 (V)", s: styleRowLabel }, { v: vMaxStr, s: styleMax }]);
      wsData.push([]); // 空行

      // ブロック作成関数
      const appendBlock = (title, startCell, endCell, headerStyle) => {
        // タイトル行
        let titleRow = [{ v: `■ ${title}`, s: styleTitle }];
        for (let i = startCell; i <= endCell; i++) titleRow.push({ v: "", s: styleTitle });
        wsData.push(titleRow);

        // セル No.
        let headerRow = [{ v: "セル No.", s: styleRowLabel }];
        for (let i = startCell; i <= endCell; i++) {
          headerRow.push({ v: i, s: headerStyle });
        }
        wsData.push(headerRow);

        // 比重
        let sgRow = [{ v: "比重 (S.G.)", s: styleRowLabel }];
        for (let i = startCell; i <= endCell; i++) {
          const rawVal = document.getElementById(`sg-${i}`).value;
          const val = parseFloat(rawVal);
          let cellStyle = styleNormal;
          if (!isNaN(val)) {
            if (stats.sg.max !== null && val === stats.sg.max) cellStyle = styleMax;
            else if (stats.sg.min !== null && val === stats.sg.min) cellStyle = styleMin;
          }
          sgRow.push({ v: rawVal !== "" ? val : "", s: cellStyle, t: rawVal !== "" ? "n" : "s" });
        }
        wsData.push(sgRow);

        // 電圧
        let vRow = [{ v: "電圧 (V)", s: styleRowLabel }];
        for (let i = startCell; i <= endCell; i++) {
          const rawVal = document.getElementById(`v-${i}`).value;
          const val = parseFloat(rawVal);
          let cellStyle = styleNormal;
          if (!isNaN(val)) {
            if (stats.v.max !== null && val === stats.v.max) cellStyle = styleMax;
            else if (stats.v.min !== null && val === stats.v.min) cellStyle = styleMin;
          }
          vRow.push({ v: rawVal !== "" ? val : "", s: cellStyle, t: rawVal !== "" ? "n" : "s" });
        }
        wsData.push(vRow);

        wsData.push([]); // 空行
      };

      appendBlock("1〜12番", 1, 12, styleHeader);
      appendBlock("13〜24番", 13, 24, styleHeader2);

      // ブック＆シート作成
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(wsData);

      // 列幅の自動設定
      const cols = [{ wch: 18 }]; // 1列目（ラベル部）
      for (let i = 1; i <= 12; i++) cols.push({ wch: 10 }); // 2〜13列目（各セル値）
      ws['!cols'] = cols;

      XLSX.utils.book_append_sheet(wb, ws, "バッテリー測定結果");

      // ファイル保存名
      const now = new Date();
      const timestamp = now.getFullYear() +
        String(now.getMonth() + 1).padStart(2, '0') +
        String(now.getDate()).padStart(2, '0') + "_" +
        String(now.getHours()).padStart(2, '0') +
        String(now.getMinutes()).padStart(2, '0');

      XLSX.writeFile(wb, `battery_data_${timestamp}.xlsx`);
      speak("罫線と色つきのExcelファイルをダウンロードしました");
    });
  </script>
</body>
</html>
