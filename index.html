<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バッテリーセル記録（セル番号必須モード）</title>
  <style>
    body { font-family: sans-serif; padding: 15px; max-width: 800px; margin: 0 auto; }
    .controls { 
      margin-bottom: 15px; 
      position: sticky; 
      top: 0; 
      background: #fff; 
      padding: 10px 0; 
      border-bottom: 2px solid #ddd;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    button { font-size: 1rem; padding: 10px 16px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; }
    #start-btn { background-color: #4CAF50; color: white; border: none; }
    #start-btn.listening { background-color: #f44336; }
    #export-btn { background-color: #2196F3; color: white; border: none; }
    
    .mode-selector {
      width: 100%;
      background: #eef6ff;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #b6d4fe;
      display: flex;
      gap: 15px;
      align-items: center;
      font-weight: bold;
    }
    .mode-selector label { cursor: pointer; }

    #status { font-weight: bold; color: #555; }
    .recognized-text { width: 100%; font-size: 0.95rem; background: #f9f9f9; padding: 8px; border: 1px solid #ddd; border-radius: 4px; color: #333; }
    .hint { width: 100%; color: #d9534f; font-size: 0.85rem; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #f0f0f0; }
    input { width: 80%; padding: 6px; text-align: right; font-size: 1rem; }
    .active-row { background-color: #e6f7ff; }
  </style>
</head>
<body>

  <h1>バッテリーセル測定記録</h1>

  <div class="controls">
    <button id="start-btn">🎤 音声入力 開始</button>
    <button id="export-btn">📊 Excel用CSV出力</button>
    <span id="status">停止中</span>

    <!-- 入力対象モード -->
    <div class="mode-selector">
      <span>現在の入力対象:</span>
      <label><input type="radio" name="input-target" value="sg" checked> 🧪 比重モード</label>
      <label><input type="radio" name="input-target" value="v"> ⚡ 電圧モード</label>
      <label><input type="radio" name="input-target" value="both"> 🔄 両方モード</label>
    </div>
    
    <div class="recognized-text">認識結果: <span id="last-speech" style="font-weight:bold; color:#1a0dab;">-</span></div>
    <div class="hint" id="mode-hint">
      ⚠️ 必ず「1番」「2番」などセル番号から発声してください。（例：「1番 1点28」）
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>セル No.</th>
        <th>比重 (S.G.)</th>
        <th>電圧 (V)</th>
      </tr>
    </thead>
    <tbody id="cell-table-body">
      <!-- 24セル生成 -->
    </tbody>
  </table>

  <script>
    // 1. テーブル生成
    const tbody = document.getElementById('cell-table-body');
    for (let i = 1; i <= 24; i++) {
      const tr = document.createElement('tr');
      tr.id = `row-${i}`;
      tr.innerHTML = `
        <td>Cell ${i}</td>
        <td><input type="number" step="0.001" id="sg-${i}" placeholder="例: 1.280"></td>
        <td><input type="number" step="0.01" id="v-${i}" placeholder="例: 2.15"></td>
      `;
      tbody.appendChild(tr);
    }

    // 日本語の数値・漢数字表記を全角半角数値に統一する変換関数
    function normalizeJapaneseNumbers(text) {
      let t = text;
      t = t.replace(/点|てん/g, '.');
      
      const kanjiMap = {
        'ゼロ':0, 'レイ':0, 'れい':0, '〇':0, '0':0,
        'イチ':1, 'いち':1, '一':1,
        'ニ':2, 'に':2, '二':2,
        'サン':3, 'さん':3, '三':3,
        'ヨン':4, 'よん':4, 'シ':4, 'し':4, '四':4,
        'ゴ':5, 'ご':5, '五':5,
        'ロク':6, 'ろく':6, '六':6,
        'ナナ':7, 'なな':7, 'シチ':7, 'しち':7, '七':7,
        'ハチ':8, 'はち':8, '八':8,
        'キュウ':9, 'きゅう':9, 'ク':9, 'く':9, '九':9,
        'ジュウ':10, 'じゅう':10, '十':10
      };

      t = t.replace(/十([一二三四五六七八九123456789])/g, (_, p1) => 10 + (kanjiMap[p1] || parseInt(p1)));
      t = t.replace(/二十([一二三四56789])/g, (_, p1) => 20 + (kanjiMap[p1] || parseInt(p1)));
      t = t.replace(/二十/g, '20');
      t = t.replace(/十/g, '10');

      t = t.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xfee0));

      for (let k in kanjiMap) {
        t = t.split(k).join(kanjiMap[k]);
      }
      return t;
    }

    // 2. 音声認識（Web Speech API）
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = false;

      const startBtn = document.getElementById('start-btn');
      const status = document.getElementById('status');
      const lastSpeech = document.getElementById('last-speech');
      let isListening = false;

      startBtn.addEventListener('click', () => {
        if (!isListening) {
          try {
            recognition.start();
            status.textContent = "音声認識中...";
            status.style.color = "green";
            startBtn.textContent = "⏹️ 音声入力 停止";
            startBtn.classList.add('listening');
            isListening = true;
          } catch (e) {
            console.error("開始エラー:", e);
          }
        } else {
          recognition.stop();
          status.textContent = "停止中";
          status.style.color = "#555";
          startBtn.textContent = "🎤 音声入力 開始";
          startBtn.classList.remove('listening');
          isListening = false;
        }
      });

      recognition.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        const rawText = event.results[lastIndex][0].transcript;
        
        lastSpeech.textContent = rawText;

        const normalized = normalizeJapaneseNumbers(rawText);
        console.log("変換後:", normalized);

        // セル番号パターン（「1番」「セル1」「No1」など）をチェック
        const cellMatch = normalized.match(/(?:セル|セルナンバー|ナンバー|No|no)?\s*(\d{1,2})\s*(?:番|セル)?/);

        // 【安全ガード】「1番〜24番」のセル番号が検出されない発声はすべて無視して処理終了
        if (!cellMatch) {
          console.log("セル番号が含まれていないため無視します:", rawText);
          return;
        }

        const cellNum = parseInt(cellMatch[1], 10);
        
        // セル番号が 1〜24 の範囲外の場合も無視
        if (cellNum < 1 || cellNum > 24) {
          console.log("範囲外のセル番号のため無視します:", cellNum);
          return;
        }

        // --- セル番号（1〜24）が含まれている場合のみ、以下の入力処理を実行 ---
        document.querySelectorAll('tr').forEach(r => r.classList.remove('active-row'));
        const targetRow = document.getElementById(`row-${cellNum}`);
        if (targetRow) {
          targetRow.classList.add('active-row');
          targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        const currentMode = document.querySelector('input[name="input-target"]:checked').value;
        const numberMatches = normalized.match(/\d(?:\.\d+)?/g);

        let val = null;
        if (numberMatches) {
          for (let numStr of numberMatches) {
            if (parseFloat(numStr) !== cellNum || numberMatches.length === 1) {
              val = numStr;
            }
          }
          if (!val && numberMatches.length > 1) {
            val = numberMatches[1];
          }
        }

        if (currentMode === 'sg' && val) {
          document.getElementById(`sg-${cellNum}`).value = val;
        } else if (currentMode === 'v' && val) {
          document.getElementById(`v-${cellNum}`).value = val;
        } else if (currentMode === 'both') {
          const sgMatch = normalized.match(/(?:比重|ひじゅう)\s*(\d(?:\.\d+)?)/);
          const vMatch = normalized.match(/(?:電圧|でんあつ)\s*(\d(?:\.\d+)?)/);
          if (sgMatch) document.getElementById(`sg-${cellNum}`).value = sgMatch[1];
          if (vMatch) document.getElementById(`v-${cellNum}`).value = vMatch[1];
        }
      };

      recognition.onerror = (event) => {
        console.error("音声認識エラー:", event.error);
        status.textContent = "エラー: " + event.error;
        status.style.color = "red";
      };

      recognition.onend = () => {
        if (isListening) {
          try {
            recognition.start();
          } catch(e) {}
        }
      };
    } else {
      alert("お使いのブラウザは音声認識機能に対応していません。Google Chromeをお試しください。");
    }

    // 3. CSV出力機能
    document.getElementById('export-btn').addEventListener('click', () => {
      let csvContent = "セル No.,比重 (S.G.),電圧 (V)\n";
      for (let i = 1; i <= 24; i++) {
        const sg = document.getElementById(`sg-${i}`).value || "";
        const v = document.getElementById(`v-${i}`).value || "";
        csvContent += `Cell ${i},${sg},${v}\n`;
      }
      const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
      const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      const now = new Date();
      const timestamp = now.getFullYear() +
        String(now.getMonth() + 1).padStart(2, '0') +
        String(now.getDate()).padStart(2, '0') + "_" +
        String(now.getHours()).padStart(2, '0') +
        String(now.getMinutes()).padStart(2, '0');
      
      link.setAttribute("href", url);
      link.setAttribute("download", `battery_data_${timestamp}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  </script>
</body>
</html>
