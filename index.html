<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バッテリーセル記録（間隔対応・音声操作対応）</title>
  <style>
    body { font-family: sans-serif; padding: 15px; max-width: 800px; margin: 0 auto; }
    .controls { 
      margin-bottom: 15px; 
      position: sticky; 
      top: 0; 
      background: #fff; 
      padding: 10px 0; 
      border-bottom: 2px solid #ddd;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    button { font-size: 1rem; padding: 10px 16px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; }
    #start-btn { background-color: #4CAF50; color: white; border: none; }
    #start-btn.listening { background-color: #f44336; }
    #undo-btn { background-color: #ff9800; color: white; border: none; }
    #export-btn { background-color: #2196F3; color: white; border: none; }
    
    .mode-selector {
      width: 100%;
      background: #eef6ff;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #b6d4fe;
      display: flex;
      gap: 15px;
      align-items: center;
      font-weight: bold;
    }
    .mode-selector label { cursor: pointer; }

    #status { font-weight: bold; color: #555; }
    .recognized-text { width: 100%; font-size: 0.95rem; background: #f9f9f9; padding: 8px; border: 1px solid #ddd; border-radius: 4px; color: #333; }
    .pending-status { color: #d9534f; font-weight: bold; margin-left: 10px; }
    .hint { width: 100%; color: #d9534f; font-size: 0.85rem; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #f0f0f0; }
    input { width: 80%; padding: 6px; text-align: right; font-size: 1rem; }
    .active-row { background-color: #e6f7ff; }
  </style>
</head>
<body>

  <h1>バッテリーセル測定記録</h1>

  <div class="controls">
    <button id="start-btn">🎤 音声入力 開始</button>
    <button id="undo-btn">↩️ 1つ戻す</button>
    <button id="export-btn">📊 Excel用CSV出力</button>
    <span id="status">停止中</span>

    <!-- 入力対象モード -->
    <div class="mode-selector">
      <span>現在の入力対象:</span>
      <label><input type="radio" name="input-target" id="radio-sg" value="sg" checked> 🧪 比重モード</label>
      <label><input type="radio" name="input-target" id="radio-v" value="v"> ⚡ 電圧モード</label>
      <label><input type="radio" name="input-target" id="radio-both" value="both"> 🔄 両方モード</label>
    </div>
    
    <div class="recognized-text">
      認識結果: <span id="last-speech" style="font-weight:bold; color:#1a0dab;">-</span>
      <span id="pending-info" class="pending-status"></span>
    </div>
    <div class="hint" id="mode-hint">
      💡 「1番」と言ってから間が空いても、数値（「1点28」など）を待機して記録します。
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>セル No.</th>
        <th>比重 (S.G.)</th>
        <th>電圧 (V)</th>
      </tr>
    </thead>
    <tbody id="cell-table-body">
      <!-- 24セル生成 -->
    </tbody>
  </table>

  <script>
    // 変更履歴スタック（Undo用）
    const historyStack = [];

    // 【新機能】番号保留管理（間隔対策）
    let pendingCellNum = null;
    let pendingTimer = null;

    function setPendingCell(cellNum) {
      pendingCellNum = cellNum;
      const pendingInfo = document.getElementById('pending-info');
      if (cellNum) {
        pendingInfo.textContent = `⏳ Cell ${cellNum} の数値待機中...`;
        
        // フォーカス表示だけ先に移動しておく
        document.querySelectorAll('tr').forEach(r => r.classList.remove('active-row'));
        const targetRow = document.getElementById(`row-${cellNum}`);
        if (targetRow) {
          targetRow.classList.add('active-row');
          targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // 5秒間数値が来なかったらクリア
        clearTimeout(pendingTimer);
        pendingTimer = setTimeout(() => {
          clearPendingCell();
        }, 5000);
      } else {
        pendingInfo.textContent = '';
      }
    }

    function clearPendingCell() {
      pendingCellNum = null;
      document.getElementById('pending-info').textContent = '';
      clearTimeout(pendingTimer);
    }

    // 1. テーブル生成
    const tbody = document.getElementById('cell-table-body');
    for (let i = 1; i <= 24; i++) {
      const tr = document.createElement('tr');
      tr.id = `row-${i}`;
      tr.innerHTML = `
        <td>Cell ${i}</td>
        <td><input type="number" step="0.001" id="sg-${i}" placeholder="例: 1.280"></td>
        <td><input type="number" step="0.01" id="v-${i}" placeholder="例: 2.15"></td>
      `;
      tbody.appendChild(tr);
    }

    // モード切り替え処理
    function setMode(modeValue) {
      const targetRadio = document.querySelector(`input[name="input-target"][value="${modeValue}"]`);
      if (targetRadio) {
        targetRadio.checked = true;
      }
    }

    // 1つ戻す (Undo) 実行関数
    function undoLastAction() {
      if (historyStack.length === 0) {
        alert("戻せる操作履歴がありません。");
        return;
      }

      const lastState = historyStack.pop();
      
      for (const inputId in lastState.values) {
        document.getElementById(inputId).value = lastState.values[inputId];
      }

      document.querySelectorAll('tr').forEach(r => r.classList.remove('active-row'));
      if (lastState.activeCellNum) {
        const targetRow = document.getElementById(`row-${lastState.activeCellNum}`);
        if (targetRow) {
          targetRow.classList.add('active-row');
          targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
      clearPendingCell();
    }

    document.getElementById('undo-btn').addEventListener('click', undoLastAction);

    // 日本語の数値・漢数字表記を全角半角数値に統一する変換関数
    function normalizeJapaneseNumbers(text) {
      let t = text;
      t = t.replace(/点|てん/g, '.');
      
      const kanjiMap = {
        'ゼロ':0, 'レイ':0, 'れい':0, '〇':0, '0':0,
        'イチ':1, 'いち':1, '一':1,
        'ニ':2, 'に':2, '二':2,
        'サン':3, 'さん':3, '三':3,
        'ヨン':4, 'よん':4, 'シ':4, 'し':4, '四':4,
        'ゴ':5, 'ご':5, '五':5,
        'ロク':6, 'ろく':6, '六':6,
        'ナナ':7, 'なな':7, 'シチ':7, 'しち':7, '七':7,
        'ハチ':8, 'はち':8, '八':8,
        'キュウ':9, 'きゅう':9, 'ク':9, 'く':9, '九':9,
        'ジュウ':10, 'じゅう':10, '十':10
      };

      t = t.replace(/十([一二三四五六七八九123456789])/g, (_, p1) => 10 + (kanjiMap[p1] || parseInt(p1)));
      t = t.replace(/二十([一二三四56789])/g, (_, p1) => 20 + (kanjiMap[p1] || parseInt(p1)));
      t = t.replace(/二十/g, '20');
      t = t.replace(/十/g, '10');

      t = t.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xfee0));

      for (let k in kanjiMap) {
        t = t.split(k).join(kanjiMap[k]);
      }
      return t;
    }

    // 2. 音声認識（Web Speech API）
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = false;

      const startBtn = document.getElementById('start-btn');
      const status = document.getElementById('status');
      const lastSpeech = document.getElementById('last-speech');
      let isListening = false;

      function stopListening() {
        isListening = false;
        recognition.stop();
        status.textContent = "停止中";
        status.style.color = "#555";
        startBtn.textContent = "🎤 音声入力 開始";
        startBtn.classList.remove('listening');
        clearPendingCell();
      }

      function startListening() {
        try {
          recognition.start();
          status.textContent = "音声認識中...";
          status.style.color = "green";
          startBtn.textContent = "⏹️ 音声入力 停止";
          startBtn.classList.add('listening');
          isListening = true;
        } catch (e) {
          console.error("開始エラー:", e);
        }
      }

      startBtn.addEventListener('click', () => {
        if (!isListening) {
          startListening();
        } else {
          stopListening();
        }
      });

      recognition.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        const rawText = event.results[lastIndex][0].transcript;
        
        lastSpeech.textContent = rawText;

        // 【音声コマンド1】入力終了（停止）
        if (rawText.match(/終了|しゅうりょう|停止|ていし|おわり|終わり/)) {
          stopListening();
          return;
        }

        // 【音声コマンド2】モード切替
        if (rawText.match(/比重|ひじゅう/)) {
          const hasCellNumber = normalizeJapaneseNumbers(rawText).match(/(?:セル|セルナンバー|ナンバー|No|no)?\s*(\d{1,2})\s*(?:番|セル)?/);
          if (!hasCellNumber || rawText.match(/モード|測り|はかり/)) {
            setMode('sg');
            clearPendingCell();
            return;
          }
        }
        if (rawText.match(/電圧|でんあつ/)) {
          const hasCellNumber = normalizeJapaneseNumbers(rawText).match(/(?:セル|セルナンバー|ナンバー|No|no)?\s*(\d{1,2})\s*(?:番|セル)?/);
          if (!hasCellNumber || rawText.match(/モード|測り|はかり/)) {
            setMode('v');
            clearPendingCell();
            return;
          }
        }

        // 【音声コマンド3】「戻す」「やり直し」「キャンセル」でUndo
        if (rawText.match(/戻す|もどす|やり直し|やりなおし|キャンセル/)) {
          undoLastAction();
          return;
        }

        const normalized = normalizeJapaneseNumbers(rawText);
        console.log("変換後:", normalized);

        // 抽出処理
        const cellMatch = normalized.match(/(?:セル|セルナンバー|ナンバー|No|no)?\s*(\d{1,2})\s*(?:番|セル)?/);
        const numberMatches = normalized.match(/\d(?:\.\d+)?/g);

        let cellNum = null;

        if (cellMatch) {
          const parsed = parseInt(cellMatch[1], 10);
          if (parsed >= 1 && parsed <= 24) {
            cellNum = parsed;
          }
        }

        // セル番号が直接指定されず、保留中のセル番号がある場合
        if (!cellNum && pendingCellNum) {
          cellNum = pendingCellNum;
        }

        // セル番号が全く特定できない場合は無視
        if (!cellNum) {
          console.log("セル番号が特定できないため無視:", rawText);
          return;
        }

        // 数値の抽出
        let val = null;
        if (numberMatches) {
          for (let numStr of numberMatches) {
            // セル番号と異なる数値、または数値単体を値として採用
            if (parseFloat(numStr) !== cellNum || (pendingCellNum && numberMatches.length === 1)) {
              val = numStr;
              break;
            }
          }
          if (!val && numberMatches.length > 1 && !pendingCellNum) {
            val = numberMatches[1];
          }
        }

        // 【判定】セル番号のみ発声され、数値がまだない場合は「保留」にする
        if (cellMatch && !val) {
          console.log(`Cell ${cellNum} のみ認識。数値を待機します...`);
          setPendingCell(cellNum);
          return;
        }

        // 数値が存在する場合は入力実行
        if (val) {
          const currentMode = document.querySelector('input[name="input-target"]:checked').value;

          const activeRow = document.querySelector('tr.active-row');
          const prevActiveCellNum = activeRow ? parseInt(activeRow.id.replace('row-', ''), 10) : null;

          const previousState = {
            activeCellNum: prevActiveCellNum,
            values: {
              [`sg-${cellNum}`]: document.getElementById(`sg-${cellNum}`).value,
              [`v-${cellNum}`]: document.getElementById(`v-${cellNum}`).value
            }
          };

          let updated = false;

          if (currentMode === 'sg') {
            document.getElementById(`sg-${cellNum}`).value = val;
            updated = true;
          } else if (currentMode === 'v') {
            document.getElementById(`v-${cellNum}`).value = val;
            updated = true;
          } else if (currentMode === 'both') {
            const sgMatch = normalized.match(/(?:比重|ひじゅう)\s*(\d(?:\.\d+)?)/);
            const vMatch = normalized.match(/(?:電圧|でんあつ)\s*(\d(?:\.\d+)?)/);
            if (sgMatch) {
              document.getElementById(`sg-${cellNum}`).value = sgMatch[1];
              updated = true;
            }
            if (vMatch) {
              document.getElementById(`v-${cellNum}`).value = vMatch[1];
              updated = true;
            }
          }

          if (updated) {
            historyStack.push(previousState);
            clearPendingCell(); // 入力完了のため保留解除

            document.querySelectorAll('tr').forEach(r => r.classList.remove('active-row'));
            const targetRow = document.getElementById(`row-${cellNum}`);
            if (targetRow) {
              targetRow.classList.add('active-row');
              targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          }
        }
      };

      recognition.onerror = (event) => {
        console.error("音声認識エラー:", event.error);
        status.textContent = "エラー: " + event.error;
        status.style.color = "red";
      };

      recognition.onend = () => {
        if (isListening) {
          try {
            recognition.start();
          } catch(e) {}
        }
      };
    } else {
      alert("お使いのブラウザは音声認識機能に対応していません。Google Chromeをお試しください。");
    }

    // 3. CSV出力機能
    document.getElementById('export-btn').addEventListener('click', () => {
      let csvContent = "セル No.,比重 (S.G.),電圧 (V)\n";
      for (let i = 1; i <= 24; i++) {
        const sg = document.getElementById(`sg-${i}`).value || "";
        const v = document.getElementById(`v-${i}`).value || "";
        csvContent += `Cell ${i},${sg},${v}\n`;
      }
      const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
      const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const now = new Date();
      const timestamp = now.getFullYear() +
        String(now.getMonth() + 1).padStart(2, '0') +
        String(now.getDate()).padStart(2, '0') + "_" +
        String(now.getHours()).padStart(2, '0') +
        String(now.getMinutes()).padStart(2, '0');
      
      const a = document.createElement("a");
      a.setAttribute("href", url);
      a.setAttribute("download", `battery_data_${timestamp}.csv`);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });
  </script>
</body>
</html>
